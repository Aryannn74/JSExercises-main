<!DOCTYPE html>
<html>
  <head>
    <title>Sum of Digits</title>
  </head>
<body>

  <input type="number" id="num" placeholder="Enter number">
  <button onclick="showSum()">Sum</button>

  <p id="result"></p>

  <script>
    function sumOfDigits(num) {
      let sum = 0;
      num = Math.abs(num);

      while (num > 0) {
        sum += num % 10;
        num = Math.floor(num / 10);
      }

      return sum;
    }

    function showSum() {
      let num = document.getElementById("num").value;
      document.getElementById("result").innerHTML = "Result: " + sumOfDigits(num);
    }
  </script>

</body>
</html>
