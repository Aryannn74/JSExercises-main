<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Largest of Three Numbers</title>
</head>

<body>
  <input type="number" id="num1" placeholder="Enter first number">
  <input type="number" id="num2" placeholder="Enter second number">
  <input type="number" id="num3" placeholder="Enter third number">

  <button onclick="findLargest()">Find Largest</button>

  <p id="result"></p>

  <script>
    function largestOfThree(a, b, c) {
      if (a >= b && a >= c) {
        return a;
      } else if (b >= a && b >= c) {
        return b;
      } else {
        return c;
      }
    }

    function findLargest() {
      let a = Number(document.getElementById("num1").value);
      let b = Number(document.getElementById("num2").value);
      let c = Number(document.getElementById("num3").value);
      
      let result = largestOfThree(a, b, c);

      document.getElementById("result").textContent =
        "Largest number is: " + result;
    }
  </script>
</body>
</html>
